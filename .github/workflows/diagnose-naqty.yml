name: Diagnose Naqty Onim server
on:
  push:
    paths:
      - '.github/workflows/diagnose-naqty.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check DNS HTTPS and CORS without sending codes
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "Naqty Onim connectivity diagnostics (NO codes or credentials sent)"
            echo "Run timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for host in mobile-app.prod.markirovka.ismet.kz mobile-app.prodg.markirovka.ismet.kz; do
              echo
              echo "--- DNS: $host ---"
              getent ahostsv4 "$host" | head -3 || true
              echo "--- HTTPS HEAD: $host ---"
              curl -sSIL -o /dev/null -w 'HTTP_STATUS=%{http_code} REMOTE_IP=%{remote_ip} SSL_VERIFY=%{ssl_verify_result}\n' --connect-timeout 8 --max-time 15 "https://$host/" 2>&1 || true
            done
            echo
            echo "--- POST invalid synthetic identifier /api/v3/check (no real goods) ---"
            curl -sS -o /tmp/naqty-post-body.txt -D /tmp/naqty-post-headers.txt -X POST --connect-timeout 8 --max-time 15 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"code":"000000000000000000000","rawCode":"000000000000000000000","group01":"00000000000000","group21":"0000000","isGs1DataCarrier":true,"persistScanResult":false}' 'https://mobile-app.prod.markirovka.ismet.kz/api/v3/check' 2>&1 || true
            grep -Ei '^(HTTP/|www-authenticate:|content-type:|server:|location:)' /tmp/naqty-post-headers.txt | head -12 || true
            echo "Response body size (bytes): $(wc -c </tmp/naqty-post-body.txt)"
            echo "Validation response (synthetic code only):"
            head -c 1200 /tmp/naqty-post-body.txt | sed -E 's/(Bearer |token[=:]")[^" ]+/\\1[REDACTED]/Ig'
            echo
            echo
            echo "--- POST minimal JSON with synthetic identifier ---"
            curl -sS -o /tmp/naqty-min-body.txt -D /tmp/naqty-min-headers.txt -X POST --connect-timeout 8 --max-time 15 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"code":"000000000000000000000"}' 'https://mobile-app.prod.markirovka.ismet.kz/api/v3/check' 2>&1 || true
            grep -Ei '^(HTTP/|www-authenticate:|content-type:|server:)' /tmp/naqty-min-headers.txt | head -8 || true
            echo "Minimal response:"
            head -c 1200 /tmp/naqty-min-body.txt
            echo
            echo
            echo "--- POST APK-matched data_matrix request using SYNTHETIC 29-character value ---"
            curl -sS -o /tmp/naqty-dm-body.txt -D /tmp/naqty-dm-headers.txt -X POST --connect-timeout 8 --max-time 15 -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"code":"00000000000000000000000000000","codeType":"data_matrix","mode":"SCAN","persistScanResult":false}' 'https://mobile-app.prod.markirovka.ismet.kz/api/v3/check' 2>&1 || true
            grep -Ei '^(HTTP/|www-authenticate:|content-type:|server:)' /tmp/naqty-dm-headers.txt | head -8 || true
            echo "APK-matched synthetic response:"
            head -c 1000 /tmp/naqty-dm-body.txt
            echo
            echo
            echo "--- CORS preflight OPTIONS /api/v3/check ---"
            curl -sSi -X OPTIONS --connect-timeout 8 --max-time 15 -H 'Origin: https://issataevun-sys.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' 'https://mobile-app.prod.markirovka.ismet.kz/api/v3/check' 2>&1 | grep -Ei '^(HTTP/|access-control-|content-type:|server:|curl:)' | head -25 || true
          } > diagnostics/naqty-connectivity.txt
          cat diagnostics/naqty-connectivity.txt
      - name: Commit diagnostics into public test repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/naqty-connectivity.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Naqty server reachability report (no marking codes)"
            git push origin HEAD:main
          fi
